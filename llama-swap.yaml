models:
  qwen3.6-35b-a3b:
    proxy: http://127.0.0.1:9000
    ttl: 600
    cmd: >
      bash -c "source /opt/intel/oneapi/setvars.sh > /dev/null && exec /home/jeff/Code/intel/llama.cpp/build/bin/llama-server
      -m /home/jeff/.lmstudio/models/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
      --mmproj /home/jeff/.lmstudio/models/unsloth/Qwen3.6-35B-A3B-GGUF/mmproj-F32.gguf
      -ngl 999
      -c 262144
      -ctk q8_0 -ctv q8_0

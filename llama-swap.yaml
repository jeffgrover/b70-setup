  # Refreshed on 5fc4f3c8c / build 2415, 2026-10-02; full report: docs/benchmarks/2026-10-01/README.md
  # - f16 KV: ~20% faster decode at 64K depth (14.98 vs 12.42 t/s); the historical +43% at 16K is not current
  # - 131072 ctx: main f16 KV needs 64 KiB/token = 8 GiB (256K would need 16 GiB and not fit)
  # - 4096/1024 batching improved pp8K ~23% and pp64K ~18%; retain normal oneDNN attention dispatch
  # - Two MTP drafts averaged 30.96 t/s on 5.5K-input / 512-output real-text controls vs 27.84 with three;
  #   one was close at 30.29. This is bounded throughput, not a complete-task quality/agent-session score
  # - reasoning budget raised 2048 -> 8192 for agent work to reduce premature truncation of useful reasoning
  # - presence penalty 0 won a seeded code-quality A/B; 1.5 exhausted 3200 tokens and returned a defective answer
  qwen3.8-27b-think:
    proxy: http://127.0.0.1:9000
    ttl: 600
    cmd: >
      bash -c "source /opt/intel/oneapi/setvars.sh > /dev/null && exec /home/jeff/Code/intel/llama.cpp/build/bin/llama-server
      -m /home/jeff/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_S.gguf
      --mmproj /home/jeff/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
      -ngl 999
      -c 131072
      -ctk f16 -ctv f16
      -fa on
      -b 4096 -ub 1024
      --parallel 1
      --metrics
      --host 127.0.0.1 --port 9000
      --jinja
      --reasoning on
      --reasoning-format deepseek
      --reasoning-budget 8192
      --reasoning-preserve
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0
      --alias qwen3.8-27b-think"

